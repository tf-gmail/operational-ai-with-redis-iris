services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: operational-ai-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./data:/data:ro
    container_name: operational-ai-backend
    environment:
      - REDIS_URL=${REDIS_URL:-}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_TLS=${REDIS_TLS:-false}
      - REDIS_TLS_INSECURE=${REDIS_TLS_INSECURE:-false}
      - REDIS_TLS_CA_CERT=${REDIS_TLS_CA_CERT:-}
      - REDIS_TLS_CLIENT_CERT=${REDIS_TLS_CLIENT_CERT:-}
      - REDIS_TLS_CLIENT_KEY=${REDIS_TLS_CLIENT_KEY:-}
      - BASELINE_STATE_TTL_SECONDS=${BASELINE_STATE_TTL_SECONDS:-86400}
      - REPLAY_STATE_TTL_SECONDS=${REPLAY_STATE_TTL_SECONDS:-14400}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: operational-ai-frontend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  redis_data:
